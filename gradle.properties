# [GUIA/ARCHIVO] Configuración de compilación: gradle.properties. Lee estos comentarios antes de modificar valores.
# [GUIA/CONFIG] Memoria y opciones de la máquina virtual usada para ejecutar Gradle.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# [GUIA/CONFIG] Permite tareas Gradle en paralelo.
org.gradle.parallel=true
# [GUIA/CONFIG] Guarda resultados compilados para acelerar sincronizaciones siguientes.
org.gradle.caching=true
# [GUIA/CONFIG] Usa paquetes AndroidX modernos.
android.useAndroidX=true
# [GUIA/CONFIG] Compatibilidad de algunas dependencias antiguas con AndroidX.
android.enableJetifier=true

# Enabled parallel sync for Gradle 9.4+
# [GUIA/CONFIG] Opción adicional de paralelismo de Gradle.
org.gradle.tooling.parallel=true

# [GUIA/CONFIG] Fuerza el uso de JDK 21 compatible con Gradle y AGP.
org.gradle.java.home=C:/Program Files/Java/jdk-21
